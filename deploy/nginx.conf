# S15 §3/§5：只转发 HTTP 面，与 deploy/Caddyfile 等价。
# 注意：游戏流量是 UDP 8788，**不经反代**（反代不代管 UDP）；请直接放行端口：
#   ufw allow 8788/udp
# 与 Caddyfile 一样只做转发：不含任何静态资源托管指令（§6-4 的字符串校验点为 0）。
server {
    listen 80;
    server_name _;

    location = /health  { proxy_pass http://127.0.0.1:8787; }
    location = /metrics { proxy_pass http://127.0.0.1:8787; }
    location /api/      { proxy_pass http://127.0.0.1:8787; }

    location / { return 404; }

    add_header Cache-Control "no-store" always;

    # UDP 8788 不在这里：反代只处理 TCP/HTTP，游戏流量直连服务器端口。
}
