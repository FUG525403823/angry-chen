# 仅反代 HTTP；游戏 UDP 8788 仍由客户端直连。
# 后端设置 AC_HTTP_BIND=127.0.0.1、AC_TRUST_LOOPBACK_PROXY=1。
# 下方 upstream 端口须与 server.env 的 AC_HTTP_PORT 保持一致。
server {
    listen 80;
    server_name _;

    # 覆盖来源标识，绝不追加或信任调用者提交的转发链。
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
    }
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
    }
    location /api/ { proxy_pass http://127.0.0.1:8787; }
    location / { return 404; }
    add_header Cache-Control "no-store" always;
}
