# ============================================================================
# Nginx 反代样例：客户端静态资源 + 游戏 WebSocket(WSS)（ADR-004 §1）
#
# 验证状态：静态审查（本机无 nginx，此文件从未被 `nginx -t` 检查过）。
# 人类必须验证的点：
#   1) 语法：`nginx -t -c /etc/nginx/nginx.conf`（若把本文件并入发行版配置，
#      只取 server {} 段落，因为 events/http/upstream 已由主配置提供）
#   2) 证书路径 /etc/letsencrypt/live/game.example.com/ 换成真实域名与证书
#   3) WSS 握手：浏览器打开 https://<域名>/?server=wss://<域名>/ws 应能进房
#      （`curl -i -H "Connection: Upgrade" -H "Upgrade: websocket" ...` 返回 101）
#   4) 缓存头：`curl -sI https://<域名>/assets/<hash>.js` 应含
#      `Cache-Control: public, max-age=31536000` 与 `Expires`
#   5) 探针：`curl -s https://<域名>/health`、`/metrics`、`/api/leaderboard`
#   6) root 指向本机 `pnpm build:client` 产物目录
# ============================================================================

worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;

	# WebSocket：把客户端的 Upgrade 头翻译成上游需要的 Connection 值
	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	log_format ac_json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr",'
		'"method":"$request_method","uri":"$request_uri","status":$status,'
		'"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_addr"}';
	access_log /var/log/nginx/angry-chen.access.log ac_json;
	error_log /var/log/nginx/angry-chen.error.log warn;

	upstream ac_game {
		server 127.0.0.1:8787;
		keepalive 16;
	}

	server {
		listen 80;
		server_name game.example.com;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name game.example.com;

		ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
		ssl_protocols TLSv1.2 TLSv1.3;

		# 客户端静态产物目录（`pnpm build:client` 的输出）
		root /srv/angry-chen/packages/client/dist;
		index index.html;

		# 健康检查：不缓存，直接转发到 Node 进程
		location = /health {
			proxy_pass http://ac_game;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			add_header Cache-Control 'no-store' always;
		}

		# Prometheus 文本指标
		location = /metrics {
			proxy_pass http://ac_game;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			add_header Cache-Control 'no-store' always;
		}

		# /api/leaderboard、/api/matches/recent
		location /api/ {
			proxy_pass http://ac_game;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			add_header Cache-Control 'no-store' always;
		}

		# 游戏 WebSocket：客户端需用 ?server=wss://<域名>/ws 指向这里；
		# 服务端接受任意路径的 upgrade（packages/server/src/transport/ws-adapter.ts）
		location /ws {
			proxy_pass http://ac_game;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			# 战斗中途不能因为读超时被掐断
			proxy_read_timeout 600s;
			proxy_send_timeout 600s;
			proxy_buffering off;
		}

		# 带内容 hash 的构建产物：一年不可变缓存
		location /assets/ {
			expires 1y;
			add_header Cache-Control 'public, max-age=31536000, immutable' always;
			try_files $uri =404;
		}

		# index.html 不缓存，保证发版后立刻拿到新 hash
		location = /index.html {
			add_header Cache-Control 'no-cache' always;
		}

		# SPA 兜底
		location / {
			add_header Cache-Control 'no-cache' always;
			try_files $uri /index.html;
		}
	}
}
