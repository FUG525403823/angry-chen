name: client engine acceptance

on:
  workflow_dispatch:

# Deliberately not pull_request: this runner has a licensed interactive engine.
# Dispatch only reviewed main; never execute untrusted fork code on the host.
permissions:
  contents: read
concurrency:
  group: licensed-engine-p0
  cancel-in-progress: false

jobs:
  engine:
    name: licensed Windows engine (real execution)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, ac-unity-licensed]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require licensed engine installation
        shell: powershell
        run: |
          if (-not $env:AC_UNITY -or -not (Test-Path -LiteralPath $env:AC_UNITY)) {
            Write-Error "BLOCKED: AC_UNITY must point to the licensed engine on this runner"
            exit 2
          }
      - name: Verify log and child exit contracts
        shell: powershell
        run: |
          ./client/tools/test-selftest-result.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./client/tools/test-process-exit.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify real UDP impairment proxy
        shell: powershell
        run: node ./client/tools/test-udp-impairment.mjs
      - name: Execute serial real P0 engine, paired performance and finite network acceptance
        shell: powershell
        run: ./tools/p0-ci-engine.ps1
      - name: Prepare sanitized evidence copies (never publish raw runner logs)
        if: always()
        shell: powershell
        run: ./tools/p0-ci-evidence-copy.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-engine-evidence
          path: build/ci-artifacts/p0-engine/
          if-no-files-found: error
