name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality (docs + assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/check-docs.mjs
      - run: node tools/check-assets.mjs

  client-scripts:
    name: client release script contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated release packaging
        shell: powershell
        run: ./client/tools/test-build.ps1
      - name: Verify successful release player discovery
        shell: powershell
        run: ./client/tools/test-player-discovery.ps1

  server:
    name: server (cmake + ninja + ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Require cmake >= 3.28
        run: |
          cmake --version
          version=$(cmake --version | head -1 | awk '{print $3}')
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -lt 28 ]; }; then
            echo "cmake $version 低于 3.28，与 server/CMakeLists.txt 的 cmake_minimum_required 不符"
            exit 1
          fi
      - name: Configure
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAC_WERROR=ON
      - name: Build
        run: cmake --build server/build
      - name: Install smoke test
        run: |
          prefix=$(mktemp -d)
          trap 'rm -rf "$prefix"' EXIT
          cmake --install server/build --prefix "$prefix"
          test -x "$prefix/bin/angry-chen-server"
          "$prefix/bin/angry-chen-server" --version
      - name: Test
        run: ctest --test-dir server/build --output-on-failure

  # S14 §4-7：同 job 依次跑 gate-4p2min、反向自检（必须红）、soak-4p5min；任一阈值 fail → 作业红。
  server-perf:
    name: server-perf (ac_gate gate-4p2min + soak + 反向自检)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAC_WERROR=ON
      - name: Build
        run: cmake --build server/build
      - name: Run performance gate (4 players, 2 min)
        env:
          AC_DATA_DIR: build/runtime/gate-4p2min
        run: |
          mkdir -p build/reports/gate-4p2min
          ./server/build/ac_gate --scenario=gate-4p2min --out=build/reports/gate-4p2min/server-perf.json
      # §6-3：反向自检必须让整跑次变红（把 G3 的上限压到 0），否则门禁本身不可信。
      - name: Reverse self-check (must fail)
        env:
          AC_DATA_DIR: build/runtime/gate-4p2min-break
        run: |
          mkdir -p build/reports/gate-4p2min-break
          if ./server/build/ac_gate --scenario=gate-4p2min --break=G3=0 --out=build/reports/gate-4p2min-break/server-perf.json; then
            echo "reverse self-check must exit non-zero" >&2
            exit 1
          fi
      - name: Run soak gate (4 players, 5 min)
        env:
          AC_DATA_DIR: build/runtime/soak-4p5min
        run: |
          mkdir -p build/reports/soak-4p5min
          ./server/build/ac_gate --scenario=soak-4p5min --out=build/reports/soak-4p5min/server-perf.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-perf-report
          path: build/reports/
          if-no-files-found: warn
