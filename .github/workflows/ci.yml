name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality (docs + assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/check-docs.mjs
      - run: node tools/check-assets.mjs

  server:
    name: server (cmake + ninja + ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Require cmake >= 3.28
        run: |
          cmake --version
          version=$(cmake --version | head -1 | awk '{print $3}')
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -lt 28 ]; }; then
            echo "cmake $version 低于 3.28，与 server/CMakeLists.txt 的 cmake_minimum_required 不符"
            exit 1
          fi
      - name: Configure
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAC_WERROR=ON
      - name: Build
        run: cmake --build server/build
      - name: Test
        run: ctest --test-dir server/build --output-on-failure

  # S14 §4-7：同 job 依次跑 gate-4p2min、反向自检（必须红）、soak-4p5min；任一阈值 fail → 作业红。
  server-perf:
    name: server-perf (ac_gate gate-4p2min + soak + 反向自检)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAC_WERROR=ON
      - name: Build
        run: cmake --build server/build
      - name: Run performance gate (4 players, 2 min)
        run: ./server/build/ac_gate --scenario=gate-4p2min --out=server/build/server-perf.json
      # §6-3：反向自检必须让整跑次变红（把 G3 的上限压到 0），否则门禁本身不可信。
      - name: Reverse self-check (must fail)
        run: |
          if ./server/build/ac_gate --scenario=gate-4p2min --break=G3=0 --out=server/build/server-perf-break.json; then
            echo "reverse self-check must exit non-zero" >&2
            exit 1
          fi
      - name: Run soak gate (4 players, 5 min)
        run: ./server/build/ac_gate --scenario=soak-4p5min --out=server/build/server-perf-soak.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-perf-report
          path: |
            server/build/server-perf.json
            server/build/server-perf-break.json
            server/build/server-perf-soak.json
          if-no-files-found: warn
